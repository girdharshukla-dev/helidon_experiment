kind: Service
apiVersion: v1
metadata:
  name: example
  labels:
    app: example
spec:
  type: ClusterIP
  selector:
    app: example
  ports:
    - name: tcp
      port: 8080
      protocol: TCP
      targetPort: 8080
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      labels:
        app: example
        version: v1
    spec:
      containers:
      - name: example
        image: example
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
